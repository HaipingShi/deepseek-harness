# Negative control for the two-process MCP resume scenario: this composition
# DOES mount the mcp-client row with `failOnStartupError: true`, but the
# fixture server path (`MCP_FIXTURE_SERVER`, supplied by the test) points at a
# nonexistent file, so the initial connection fails and the boot must fail
# loudly (exit 1 with the owning plugin's diagnostic) — distinguishable from
# an overlay that never mounts the bridge at all.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: mcp-resume-mock
        model: mcp-resume-mock
        sessionId: mcp-resume-startup-fail
        cwd: !!js process.env.MCP_RESUME_ROOT

- id: shell-env
  config:
    dshHome: !!js process.env.MCP_RESUME_ROOT + '/dsh-home'

- id: agent-instructions
  disabled: true

- id: skill-filesystem
  config:
    dshHome: !!js process.env.MCP_RESUME_ROOT + '/dsh-home'
    agentsHome: !!js process.env.MCP_RESUME_ROOT + '/agents-home'

- id: session-persistence-jsonl
  config:
    root: !!js process.env.MCP_RESUME_ROOT + '/sessions'

- insert:
    - id: mcp-fixture
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: fixture
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js process.env.MCP_FIXTURE_SERVER
        env: {}
        toolCallTimeoutMs: 15000
        failOnStartupError: true
