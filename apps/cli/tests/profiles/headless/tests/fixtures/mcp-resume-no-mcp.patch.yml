# Negative control for the two-process MCP resume scenario: the SAME
# composition WITHOUT any mcp-client row. This is the field incident's failure
# mode — an overlay that never mounts the bridge — so the run boots fine while
# the request carries no mcp tools at all.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: mcp-resume-mock
        model: mcp-resume-mock
        sessionId: mcp-resume-process-a
        cwd: !!js process.env.MCP_RESUME_ROOT

- id: shell-env
  config:
    dshHome: !!js process.env.MCP_RESUME_ROOT + '/dsh-home'

- id: agent-instructions
  disabled: true

- id: skill-filesystem
  config:
    dshHome: !!js process.env.MCP_RESUME_ROOT + '/dsh-home'
    agentsHome: !!js process.env.MCP_RESUME_ROOT + '/agents-home'

- id: session-persistence-jsonl
  config:
    root: !!js process.env.MCP_RESUME_ROOT + '/sessions'

- insert:
    - id: mcp-resume-mock-llm
      name: './mcp-resume-mock-llm.ts'
